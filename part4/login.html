<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HBnB · Login</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <header>
        <div class="header-inner">
            <div class="brand">
                <img src="images/logo.png" class="logo" alt="HBnB logo">
                <div>
                    <h1>HBnB</h1>
                    <p>Login to book and review places.</p>
                </div>
            </div>
            <div class="nav-actions">
                <a href="index.html" class="nav-link">Home</a>
                <a href="login.html" id="login-link" class="nav-link">Login</a>
                <button id="logout-button" class="nav-link secondary-button">Logout</button>
            </div>
        </div>
    </header>

    <main class="center-page">
        <section class="card login-card">
            <h2>Welcome back</h2>
            <p>Please sign in to continue.</p>
            <form id="login-form" class="form">
                <label for="email">Email</label>
                <input type="email" id="email" name="email" required>

                <label for="password">Password</label>
                <input type="password" id="password" name="password" required>

                <button type="submit">Login</button>
            </form>
        </section>
    </main>

    <footer>
        <p>HBnB · All rights reserved.</p>
    </footer>

    <script src="scripts.js"></script>
</body>
</html>
