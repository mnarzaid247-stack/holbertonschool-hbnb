<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HBnB · Place Details</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <header>
        <div class="header-inner">
            <div class="brand">
                <img src="images/logo.png" class="logo" alt="HBnB logo">
                <div>
                    <h1>HBnB</h1>
                    <p>Discover the perfect stay.</p>
                </div>
            </div>
            <div class="nav-actions">
                <a href="index.html" class="nav-link">Home</a>
                <a href="login.html" id="login-link" class="nav-link">Login</a>
                <button id="logout-button" class="nav-link secondary-button hidden">Logout</button>
                <button id="theme-toggle" class="theme-toggle" aria-label="Toggle dark mode">🌙</button>
            </div>
        </div>
    </header>

    <main class="place-page">
        <section class="place-layout">
            <article id="place-details" class="place-details"></article>
            <aside class="sidebar-panel">
                <div id="reviews" class="review-panel"></div>
                <div id="add-review" class="card review-form-card">
                    <h2>Add a Review</h2>
                    <form id="review-form" class="form">
                        <label for="review-text">Your Review</label>
                        <textarea id="review-text" name="review-text" required></textarea>
                        <label for="rating">Rating</label>
                        <select id="rating" name="rating" required>
                            <option value="" disabled selected>Select rating</option>
                            <option value="1">1</option>
                            <option value="2">2</option>
                            <option value="3">3</option>
                            <option value="4">4</option>
                            <option value="5">5</option>
                        </select>
                        <button type="submit">Submit Review</button>
                    </form>
                </div>
            </aside>
        </section>
    </main>

    <footer>
        <p>HBnB · All rights reserved.</p>
    </footer>

    <script src="scripts.js"></script>
</body>
</html>
