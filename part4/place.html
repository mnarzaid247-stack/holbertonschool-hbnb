<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Place Details</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <header>
        <img src="images/logo.png" class="logo" alt="logo">
        <nav>
            <a href="index.html">Home</a>
            <a href="login.html" id="login-link" class="login-button">Login</a>
        </nav>
    </header>
    <main>
        <section id="place-details" class="place-details">
            <div calss="place-info">
                <h2>Place Name</h2>
                <p>Host: John</p>
                <p>Price: 100$/night</p>
                <p>Description: Nice Place</p>
            </div>
        </section>
        <section id="reviews">
            <div class="review-card">
                <p>User: Ahmed</p>
                <p>Rating: 5</p>
                <p>Great Place!</p>
            </div>
        </section>
        <section id="add-review" class="add-review">
            <h2>Add a Review</h2>
            <form id="review-form" class="form">
                <label for="review-text">Review:</label>
                <textarea id="review-text" name="review-text" required></textarea>
                
                <button type="submit">Submit</button>
            </form>
        </section>
    </main>
    <footer>
        <p>all rights reserved</p>
    </footer>
    <script src="scripts.js"></script>
</body>
</html>
